name: Alfred Workflows

on:
  push:
    branches: [main]
    paths: [bin/alfredworkflow/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency: alfred-workflows

env:
  TAG: alfredworkflow
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          cd bin/alfredworkflow
          all=$(for p in */info.plist; do dirname "$p"; done)
          if [[ $GITHUB_EVENT_NAME != push ]] || ! gh release view "$TAG" >/dev/null 2>&1 ||
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- build; then
            names=$all
          else
            names=$(git diff --name-only "$BEFORE" HEAD -- . | cut -d/ -f3 | sort -u | grep -Fx -f <(echo "$all") || true)
          fi
          echo "names=$(echo $names)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: bin/alfredworkflow/build dist $NAMES
      - if: steps.changed.outputs.names != ''
        run: |
          for file in dist/*.alfredworkflow; do
            name=$(basename "$file" .alfredworkflow)
            version=$(unzip -p "$file" info.plist | plutil -extract version raw -)
            mv "$file" "dist/$name-$version.alfredworkflow"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Alfred Workflows" --notes "" --latest=false
          fi
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            name=${asset%-*}
            if [[ ! -f bin/alfredworkflow/$name/info.plist ]] || compgen -G "dist/$name-[0-9]*.alfredworkflow" >/dev/null; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
          gh release upload "$TAG" dist/*.alfredworkflow
          list=$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.updatedAt)"' | sort | while IFS=$'\t' read -r asset at; do
            name=${asset%-*}
            version=${asset#"$name"-}
            echo "- ${version%.alfredworkflow} $(plutil -extract name raw "bin/alfredworkflow/$name/info.plist") (${at:0:10} ${at:11:5} UTC)"
          done)
          gh release edit "$TAG" --notes "$(printf '```md\n%s\n```' "$list")"
